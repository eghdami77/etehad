<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#121824">
  <meta name="description" content="اتحادهای ریاضی - آموزش تعاملی و آزمون">
  <title>اتحادهای ریاضی</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%93%90%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      --bg-dark: #121824;
      --yellow-arrow: #ffeb3b;
      --red-highlight: #e53935;
      --quiz-bg: #0a1f44;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html {
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
      font-family: Vazir, Vazirmatn, Tahoma, 'Segoe UI', sans-serif;
      background-color: var(--bg-dark);
      background-image:
        radial-gradient(circle at 15% 20%, rgba(30, 136, 229, 0.25) 0%, transparent 40%),
        radial-gradient(circle at 85% 80%, rgba(13, 71, 161, 0.3) 0%, transparent 45%);
      background-attachment: fixed;
      min-height: 100vh;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
      position: relative;
    }

    button {
      font-family: inherit;
      touch-action: manipulation;
      -webkit-user-select: none;
      user-select: none;
    }

    /* Floating background symbols */
    .bg-stickers {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
      overflow: hidden;
    }

    .sticker {
      position: absolute;
      color: rgba(255, 255, 255, 0.07);
      font-size: 2rem;
      font-weight: bold;
      animation: float 12s infinite linear;
      will-change: transform;
    }

    @keyframes float {
      0% { transform: translateY(105vh) rotate(0deg); opacity: 0; }
      20% { opacity: 0.8; }
      80% { opacity: 0.8; }
      100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
    }

    /* Header */
    header {
      z-index: 2;
      width: 100%;
      max-width: 900px;
      padding: 15px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    h1.main-title {
      color: #ffffff;
      margin: 0;
      font-size: 1.8rem;
      text-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }

    .audio-controls {
      display: flex;
      gap: 10px;
    }

    .btn-control {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.25), rgba(255, 255, 255, 0.05));
      color: #fff;
      border: 1.5px solid rgba(255, 255, 255, 0.8);
      padding: 10px 16px;
      min-height: 44px;
      border-radius: 22px;
      cursor: pointer;
      font-size: 0.9rem;
      -webkit-backdrop-filter: blur(8px);
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 10px rgba(0,0,0,0.3);
      transition: all 0.2s ease;
    }

    .btn-control:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.15));
      transform: translateY(-2px);
    }

    /* Main canvas */
    .main-container {
      z-index: 2;
      width: 92%;
      max-width: 850px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 12px 35px rgba(0,0,0,0.5);
      padding: 25px;
      min-height: 220px;
      margin-bottom: 25px;
      position: relative;
      overflow: hidden;
      color: #222;
      border: 2px solid rgba(255, 255, 255, 0.5);
    }

    .canvas-instruction {
      text-align: center;
      font-size: 1.3rem;
      color: #333;
      margin-top: 60px;
      font-weight: bold;
    }

    .math-display {
      direction: ltr;
      text-align: left;
      font-family: 'Times New Roman', Times, serif;
      font-size: 1.4rem;
      line-height: 2;
      padding: 10px;
      overflow-wrap: anywhere;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    .math-title {
      direction: rtl;
      text-align: right;
      font-family: inherit;
      font-size: 1.3rem;
      font-weight: bold;
      color: #0d47a1;
      margin-bottom: 10px;
      border-bottom: 2px solid #e0e0e0;
      padding-bottom: 5px;
    }

    .example-label {
      direction: rtl;
      text-align: right;
      font-family: inherit;
      font-size: 1.1rem;
      font-weight: bold;
      color: #333;
      margin-top: 15px;
    }

    .pulse-red {
      display: inline-block;
      color: var(--red-highlight) !important;
      font-weight: bold;
      transform: scale(1.35);
      transition: transform 0.3s ease, color 0.3s ease;
    }

    /* Buttons */
    .buttons-section {
      z-index: 2;
      width: 92%;
      max-width: 850px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      padding-bottom: 10px;
    }

    .arrow-container {
      display: flex;
      justify-content: space-around;
      width: 100%;
      height: 25px;
      position: relative;
    }

    .arrow-indicator {
      width: 0;
      height: 0;
      border-left: 10px solid transparent;
      border-right: 10px solid transparent;
      border-top: 15px solid var(--yellow-arrow);
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.4));
      animation: bounce 0.8s infinite alternate ease-in-out;
    }

    @keyframes bounce {
      0% { transform: translateY(0); }
      100% { transform: translateY(8px); }
    }

    .btn-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 14px;
    }

    .btn-identity {
      background: linear-gradient(180deg, #1e88e5 0%, #0d47a1 100%);
      color: white;
      border: 2px solid #ffffff;
      padding: 12px 10px;
      min-height: 52px;
      border-radius: 12px;
      font-size: 0.95rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 6px 0 #0a3170, 0 8px 15px rgba(0,0,0,0.4);
      transition: all 0.1s ease;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.4);
      position: relative;
    }

    .btn-identity:hover {
      background: linear-gradient(180deg, #2196f3 0%, #1565c0 100%);
      transform: translateY(-2px);
      box-shadow: 0 8px 0 #0a3170, 0 10px 18px rgba(0,0,0,0.4);
    }

    .btn-identity:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #0a3170, 0 3px 6px rgba(0,0,0,0.3);
    }

    .btn-quiz {
      background: linear-gradient(180deg, #b0244d 0%, #6d0f2a 100%);
      color: white;
      border: 2px solid #ffffff;
      padding: 10px 8px;
      min-height: 48px;
      border-radius: 12px;
      font-size: 0.9rem;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 0 #4a0a1c, 0 6px 12px rgba(0,0,0,0.3);
      transition: all 0.1s ease;
      text-align: center;
      text-shadow: 0 1px 2px rgba(0,0,0,0.3);
    }

    .btn-quiz:hover {
      background: linear-gradient(180deg, #c93a63 0%, #84163a 100%);
      transform: translateY(-2px);
      box-shadow: 0 7px 0 #4a0a1c, 0 8px 15px rgba(0,0,0,0.35);
    }

    .btn-quiz:active {
      transform: translateY(3px);
      box-shadow: 0 2px 0 #4a0a1c, 0 3px 5px rgba(0,0,0,0.3);
    }

    /* Quiz overlay */
    .quiz-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: var(--quiz-bg);
      z-index: 100;
      display: none;
      flex-direction: column;
      align-items: center;
      padding: calc(20px + env(safe-area-inset-top, 0px)) 20px calc(20px + env(safe-area-inset-bottom, 0px));
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    .quiz-container {
      width: 100%;
      max-width: 700px;
      background: white;
      border-radius: 16px;
      padding: 25px;
      margin-top: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      color: #222;
      position: relative;
      z-index: 1;
      border: 2px solid #ffffff;
    }

    .quiz-options {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 20px;
      direction: ltr;
    }

    .quiz-option-btn {
      background: linear-gradient(180deg, #ffffff 0%, #f0f4f8 100%);
      border: 2px solid #b0bec5;
      padding: 12px 15px;
      min-height: 48px;
      border-radius: 10px;
      font-size: 1.1rem;
      cursor: pointer;
      text-align: left;
      transition: all 0.15s;
      font-family: 'Times New Roman', serif;
      box-shadow: 0 4px 0 #cfd8dc;
      overflow-wrap: anywhere;
    }

    .quiz-option-btn:hover {
      background: linear-gradient(180deg, #e1f5fe 0%, #b3e5fc 100%);
      border-color: #29b6f6;
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #81d4fa;
    }

    .quiz-option-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px 0 #81d4fa;
    }

    .quiz-nav {
      display: flex;
      justify-content: space-between;
      flex-wrap: wrap;
      width: 100%;
      max-width: 700px;
      margin-top: 15px;
      gap: 10px;
      position: relative;
      z-index: 1;
    }

    /* Celebration */
    .star-celebration {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100%;
      pointer-events: none;
      z-index: 200;
      overflow: hidden;
    }

    .star {
      position: absolute;
      font-size: 2rem;
      animation: fall 3s infinite linear;
    }

    @keyframes fall {
      0% { transform: translateY(-50px) rotate(0deg); opacity: 1; }
      100% { transform: translateY(105vh) rotate(360deg); opacity: 0; }
    }

    footer {
      z-index: 2;
      margin-top: auto;
      padding: 25px 10px 15px 10px;
      color: rgba(255, 255, 255, 0.7);
      font-size: 0.95rem;
      text-align: center;
    }

    /* Mobile */
    @media (max-width: 600px) {
      .btn-grid.identity-grid {
        grid-template-columns: 1fr;
      }
      .arrow-container {
        display: none;
      }
      header {
        padding: 12px 14px;
        justify-content: center;
      }
      h1.main-title {
        font-size: 1.5rem;
        width: 100%;
        text-align: center;
      }
      .main-container {
        padding: 16px;
        min-height: 200px;
      }
      .canvas-instruction {
        margin-top: 40px;
        font-size: 1.15rem;
      }
      .math-display {
        font-size: 1.15rem;
        padding: 6px;
      }
      .math-title {
        font-size: 1.1rem;
      }
      .btn-quiz {
        font-size: 0.8rem;
        padding: 8px 4px;
      }
      .quiz-container {
        padding: 18px;
      }
      .quiz-option-btn {
        font-size: 1rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .sticker, .arrow-indicator { animation: none; }
    }
  </style>
</head>
<body>

  <!-- Floating background -->
  <div class="bg-stickers" id="bgStickers"></div>

  <!-- Header -->
  <header>
    <h1 class="main-title">اتحادهای ریاضی</h1>
    <div class="audio-controls">
      <button class="btn-control" id="btnToggleAudio" onclick="toggleAudio()">پخش آهنگ</button>
      <button class="btn-control" onclick="resetCanvas()">پاک کردن</button>
    </div>
  </header>

  <!-- Main display -->
  <main class="main-container" id="mainCanvas">
    <div class="canvas-instruction" id="canvasInstruction">
      یک اتحاد را انتخاب کنید
    </div>
    <div id="mathOutput" style="display: none;"></div>
  </main>

  <!-- Buttons -->
  <section class="buttons-section">
    <div class="arrow-container" id="arrowContainer">
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
      <div class="arrow-indicator"></div>
    </div>

    <div class="btn-grid identity-grid">
      <button class="btn-identity" onclick="playIdentity(1)">۱. مربع مجموع دو جمله‌ای</button>
      <button class="btn-identity" onclick="playIdentity(2)">۲. مربع تفاضل دو جمله‌ای</button>
      <button class="btn-identity" onclick="playIdentity(3)">۳. مربع مجموع سه جمله‌ای</button>
      <button class="btn-identity" onclick="playIdentity(4)">۴. اتحاد مزدوج</button>
      <button class="btn-identity" onclick="playIdentity(5)">۵. اتحاد جمله مشترک</button>
      <button class="btn-identity" onclick="playIdentity(6)">۶. مکعب مجموع دو جمله‌ای</button>
      <button class="btn-identity" onclick="playIdentity(7)">۷. مکعب تفاضل دو جمله‌ای</button>
      <button class="btn-identity" onclick="playIdentity(8)">۸. مجموع مکعبات دو جمله</button>
      <button class="btn-identity" onclick="playIdentity(9)">۹. تفاضل مکعبات دو جمله</button>
    </div>

    <div class="btn-grid" style="margin-top: 10px;">
      <button class="btn-quiz" onclick="startQuiz(1)">آزمون اتحاد ۱</button>
      <button class="btn-quiz" onclick="startQuiz(2)">آزمون اتحاد ۲</button>
      <button class="btn-quiz" onclick="startQuiz(3)">آزمون اتحاد ۳</button>
      <button class="btn-quiz" onclick="startQuiz(4)">آزمون اتحاد ۴</button>
      <button class="btn-quiz" onclick="startQuiz(5)">آزمون اتحاد ۵</button>
      <button class="btn-quiz" onclick="startQuiz(6)">آزمون اتحاد ۶</button>
      <button class="btn-quiz" onclick="startQuiz(7)">آزمون اتحاد ۷</button>
      <button class="btn-quiz" onclick="startQuiz(8)">آزمون اتحاد ۸</button>
      <button class="btn-quiz" onclick="startQuiz(9)">آزمون اتحاد ۹</button>
    </div>
  </section>

  <!-- Quiz overlay -->
  <div class="quiz-overlay" id="quizOverlay">
    <div class="bg-stickers" id="quizBgStickers"></div>
    <div class="quiz-container">
      <div id="quizHeader" class="math-title">آزمون</div>
      <div id="quizQuestion" class="math-display"></div>
      <div id="quizOptions" class="quiz-options"></div>
    </div>
    <div class="quiz-nav">
      <button class="btn-control" onclick="returnToIdentity()">دیدن اتحاد مربوطه</button>
      <button class="btn-control" onclick="closeQuiz()">برگشت به صفحه اول</button>
    </div>
  </div>

  <!-- Celebration -->
  <div class="star-celebration" id="starCelebration"></div>

  <footer dir="ltr">
    Eghdami moghaddam
  </footer>

  <!-- Background music -->
  <audio id="bgMusic" loop preload="none" playsinline src="https://mixkit.ir/wp-content/uploads/2022/03/XWorld-S10.mp3"></audio>

  <script>
    /* ---------- Click sound (created lazily so mobile browsers allow it) ---------- */
    let audioCtx = null;
    function playClickSound() {
      try {
        if (!audioCtx) {
          const AC = window.AudioContext || window.webkitAudioContext;
          if (!AC) return;
          audioCtx = new AC();
        }
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(400, audioCtx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (err) { /* ignore */ }
    }

    document.addEventListener('click', (e) => {
      if (e.target.closest('button')) playClickSound();
    });

    /* ---------- Background music ---------- */
    const bgMusic = document.getElementById('bgMusic');
    const btnAudio = document.getElementById('btnToggleAudio');

    bgMusic.addEventListener('play', () => { btnAudio.innerText = 'توقف آهنگ'; });
    bgMusic.addEventListener('pause', () => { btnAudio.innerText = 'پخش آهنگ'; });
    bgMusic.addEventListener('error', () => {
      btnAudio.innerText = 'پخش آهنگ';
      alert('آهنگ بارگذاری نشد. اتصال اینترنت را بررسی کنید.');
    });

    function toggleAudio() {
      if (!bgMusic.paused) {
        bgMusic.pause();
      } else {
        const p = bgMusic.play();
        if (p && p.catch) {
          p.catch(() => {
            btnAudio.innerText = 'پخش آهنگ';
          });
        }
      }
    }

    /* ---------- Helpers ---------- */
    function toPersianDigits(num) {
      const pNums = ['۰', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      return num.toString().replace(/\d/g, x => pNums[x]);
    }

    const isSmallScreen = window.matchMedia('(max-width: 600px)').matches;

    function createBackgroundStickers(containerId, extraSymbols = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      const baseSymbols = ['a', 'b', 'c', 'x', 'y', 'm', '۱', '۲', '۳', '۴', '۵', '۶', '۷', '۸', '۹'];
      const mathSymbols = ['+', '-', '×', '÷', '=', '²', '³'];
      const symbols = extraSymbols ? [...baseSymbols, ...mathSymbols] : baseSymbols;
      const count = isSmallScreen ? 14 : 25;

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'sticker';
        el.innerText = symbols[Math.floor(Math.random() * symbols.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (8 + Math.random() * 10) + 's';
        el.style.animationDelay = (Math.random() * 5) + 's';
        el.style.fontSize = (1.2 + Math.random() * 1.5) + 'rem';
        container.appendChild(el);
      }
    }

    createBackgroundStickers('bgStickers');

    let currentAnimationTimer = [];

    function clearTimers() {
      currentAnimationTimer.forEach(t => clearTimeout(t));
      currentAnimationTimer = [];
    }

    function resetCanvas() {
      clearTimers();
      document.getElementById('canvasInstruction').style.display = 'block';
      const output = document.getElementById('mathOutput');
      output.style.display = 'none';
      output.innerHTML = '';
    }

    function delay(ms) {
      return new Promise(resolve => {
        const t = setTimeout(resolve, ms);
        currentAnimationTimer.push(t);
      });
    }

    /* ---------- Identities (data-driven animation) ---------- */
    const S2 = '<sup>۲</sup>';
    const S3 = '<sup>۳</sup>';

    // p: highlight element id for `ms`; a: append html after `ms` delay
    const IDENTITIES = {
      1: {
        title: 'اتحاد مربع (مجموع) دو جمله‌ای',
        formula: `(a + b)${S2} = <span id="f_a2">a${S2}</span> + <span id="f_2ab">۲ab</span> + <span id="f_b2">b${S2}</span>`,
        start: `(x + ۳)${S2} = `,
        steps: [
          { p: 'f_a2', ms: 1000 }, { a: '(x', ms: 0 }, { a: ')', ms: 500 }, { a: S2, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_2ab', ms: 500 }, { a: '۲', ms: 500 }, { a: '(x)', ms: 500 }, { a: '(۳)', ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_b2', ms: 500 }, { a: '(۳', ms: 0 }, { a: ')', ms: 500 }, { a: S2, ms: 500 },
          { a: ` = x${S2} + ۶x + ۹`, ms: 500 }
        ]
      },
      2: {
        title: 'اتحاد مربع (تفاضل) دو جمله‌ای',
        formula: `(a - b)${S2} = <span id="f_a2">a${S2}</span> - <span id="f_2ab">۲ab</span> + <span id="f_b2">b${S2}</span>`,
        start: `(x - ۵)${S2} = `,
        steps: [
          { p: 'f_a2', ms: 1000 }, { a: '(x', ms: 0 }, { a: ')', ms: 500 }, { a: S2, ms: 500 },
          { a: ' - ', ms: 500 }, { p: 'f_2ab', ms: 500 }, { a: '۲', ms: 500 }, { a: '(x)', ms: 500 }, { a: '(۵)', ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_b2', ms: 1000 }, { a: '(۵', ms: 0 }, { a: ')', ms: 500 }, { a: S2, ms: 500 },
          { a: ` = x${S2} - ۱۰x + ۲۵`, ms: 500 }
        ]
      },
      3: {
        title: 'اتحاد مربع (مجموع) سه جمله‌ای',
        formula: `(a + b + c)${S2} = <span id="f_a2">a${S2}</span> + <span id="f_b2">b${S2}</span> + <span id="f_c2">c${S2}</span> + <span id="f_2ab">۲ab</span> + <span id="f_2ac">۲ac</span> + <span id="f_2bc">۲bc</span>`,
        start: `(x + y + ۷)${S2} = `,
        steps: [
          { p: 'f_a2', ms: 1000 }, { a: '(x', ms: 0 }, { a: `)${S2}`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_b2', ms: 500 }, { a: '(y', ms: 0 }, { a: `)${S2}`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_c2', ms: 500 }, { a: '(۷', ms: 0 }, { a: `)${S2}`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_2ab', ms: 500 }, { a: '۲(x)(y)', ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_2ac', ms: 1000 }, { a: '۲(x)(۷)', ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_2bc', ms: 1000 }, { a: '۲(y)(۷)', ms: 500 },
          { a: ` = x${S2} + y${S2} + ۴۹ + ۲xy + ۱۴x + ۱۴y`, ms: 500 }
        ]
      },
      4: {
        title: 'اتحاد مزدوج',
        formula: `(a + b)(a - b) = <span id="f_a2">a${S2}</span> - <span id="f_b2">b${S2}</span>`,
        start: '(x + ۳)(x - ۳) = ',
        steps: [
          { p: 'f_a2', ms: 1000 }, { a: '(x', ms: 0 }, { a: `)${S2}`, ms: 500 },
          { a: ' - ', ms: 500 }, { p: 'f_b2', ms: 1000 }, { a: '(۳', ms: 0 }, { a: `)${S2}`, ms: 500 },
          { a: ` = x${S2} - ۹`, ms: 500 }
        ]
      },
      5: {
        title: 'اتحاد جمله مشترک',
        formula: `(x + a)(x + b) = <span id="f_x2">x${S2}</span> + <span id="f_abx">(a + b)x</span> + <span id="f_ab">ab</span>`,
        start: '(m + ۳)(m + ۸) = ',
        steps: [
          { p: 'f_x2', ms: 1000 }, { a: '(m', ms: 0 }, { a: `)${S2}`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_abx', ms: 1000 }, { a: '(۳ + ۸)m', ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_ab', ms: 1000 }, { a: '(۳)', ms: 500 }, { a: '(۸)', ms: 500 },
          { a: ` = m${S2} + ۱۱m + ۲۴`, ms: 500 }
        ]
      },
      6: {
        title: 'اتحاد مکعب (مجموع) دو جمله‌ای',
        formula: `(a + b)${S3} = <span id="f_a3">a${S3}</span> + <span id="f_3a2b">۳a${S2}b</span> + <span id="f_3ab2">۳ab${S2}</span> + <span id="f_b3">b${S3}</span>`,
        start: `(x + ۲)${S3} = `,
        steps: [
          { p: 'f_a3', ms: 1000 }, { a: `(x)${S3}`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_3a2b', ms: 1000 }, { a: `۳(x)${S2}(۲)`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_3ab2', ms: 1000 }, { a: `۳(x)(۲)${S2}`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_b3', ms: 1000 }, { a: `(۲)${S3}`, ms: 0 },
          { a: ` = x${S3} + ۶x${S2} + ۱۲x + ۸`, ms: 500 }
        ]
      },
      7: {
        title: 'اتحاد مکعب (تفاضل) دو جمله‌ای',
        formula: `(a - b)${S3} = <span id="f_a3">a${S3}</span> - <span id="f_3a2b">۳a${S2}b</span> + <span id="f_3ab2">۳ab${S2}</span> - <span id="f_b3">b${S3}</span>`,
        start: `(x - ۲)${S3} = `,
        steps: [
          { p: 'f_a3', ms: 1000 }, { a: `(x)${S3}`, ms: 500 },
          { a: ' - ', ms: 500 }, { p: 'f_3a2b', ms: 1000 }, { a: `۳(x)${S2}(۲)`, ms: 500 },
          { a: ' + ', ms: 500 }, { p: 'f_3ab2', ms: 1000 }, { a: `۳(x)(۲)${S2}`, ms: 500 },
          { a: ' - ', ms: 500 }, { p: 'f_b3', ms: 1000 }, { a: `(۲)${S3}`, ms: 0 },
          { a: ` = x${S3} - ۶x${S2} + ۱۲x - ۸`, ms: 500 }
        ]
      },
      8: {
        title: 'اتحاد مجموع مکعبات دو جمله',
        formula: `a${S3} + b${S3} = (a + b)(a${S2} - ab + b${S2})`,
        start: `(x + ۵)(x${S2} - ۵x + ۵${S2}) = `,
        steps: [
          { a: `(x)${S3}`, ms: 500 }, { a: ' + ', ms: 500 }, { a: `(۵)${S3}`, ms: 500 },
          { a: ` = x${S3} + ۱۲۵`, ms: 500 }
        ]
      },
      9: {
        title: 'اتحاد تفاضل مکعبات دو جمله',
        formula: `a${S3} - b${S3} = (a - b)(a${S2} + ab + b${S2})`,
        start: `(x - ۵)(x${S2} + ۵x + ۵${S2}) = `,
        steps: [
          { a: `(x)${S3}`, ms: 500 }, { a: ' - ', ms: 500 }, { a: `(۵)${S3}`, ms: 500 },
          { a: ` = x${S3} - ۱۲۵`, ms: 500 }
        ]
      }
    };

    async function playIdentity(num) {
      resetCanvas();
      document.getElementById('canvasInstruction').style.display = 'none';
      const output = document.getElementById('mathOutput');
      output.style.display = 'block';

      const cfg = IDENTITIES[num];
      output.innerHTML = `
        <div class="math-title">${cfg.title}</div>
        <div class="math-display">${cfg.formula}</div>
        <div class="example-label">مثال</div>
        <div class="math-display" id="ex_line"></div>
      `;

      await delay(1000);
      const ex = document.getElementById('ex_line');
      ex.innerHTML = cfg.start;

      for (const step of cfg.steps) {
        if (step.p) {
          const el = document.getElementById(step.p);
          if (el) el.classList.add('pulse-red');
          await delay(step.ms);
          if (el) el.classList.remove('pulse-red');
        } else {
          if (step.ms) await delay(step.ms);
          ex.innerHTML += step.a;
        }
      }
    }

    /* ---------- Quiz ---------- */
    let currentQuizIdentity = 1;
    let quizQuestionStep = 0;
    let quizScore = 0;
    let quizQuestionsData = [];
    let celebrationTimer = null;

    function startQuiz(identityNum) {
      currentQuizIdentity = identityNum;
      quizQuestionStep = 0;
      quizScore = 0;
      createBackgroundStickers('quizBgStickers', true);
      generateQuizQuestions(identityNum);
      document.getElementById('quizOverlay').style.display = 'flex';
      document.getElementById('quizOverlay').scrollTop = 0;
      renderQuizQuestion();
    }

    function closeQuiz() {
      document.getElementById('quizOverlay').style.display = 'none';
      document.getElementById('starCelebration').innerHTML = '';
      clearTimeout(celebrationTimer);
    }

    function returnToIdentity() {
      closeQuiz();
      playIdentity(currentQuizIdentity);
    }

    function buildQuestion(idNum) {
      const vars = ['x', 'm', 'a', 'b'];
      const v = vars[Math.floor(Math.random() * vars.length)];
      const n1 = Math.floor(Math.random() * 9) + 1;
      const n2 = Math.floor(Math.random() * 9) + 1;
      const P = toPersianDigits;

      let qText = '', correct = '', w1 = '', w2 = '', w3 = '';

      if (idNum === 1) {
        qText = `(${v} + ${P(n1)})${S2} = ?`;
        correct = `${v}${S2} + ${P(2*n1)}${v} + ${P(n1*n1)}`;
        w1 = `${v}${S2} + ${P(n1)}${v} + ${P(n1*n1)}`;
        w2 = `${v}${S2} + ${P(2*n1)}${v} + ${P(2*n1)}`;
        w3 = `${v}${S2} + ${P(n1*n1)}`;
      } else if (idNum === 2) {
        qText = `(${v} - ${P(n1)})${S2} = ?`;
        correct = `${v}${S2} - ${P(2*n1)}${v} + ${P(n1*n1)}`;
        w1 = `${v}${S2} - ${P(n1)}${v} + ${P(n1*n1)}`;
        w2 = `${v}${S2} + ${P(2*n1)}${v} - ${P(n1*n1)}`;
        w3 = `${v}${S2} - ${P(n1*n1)}`;
      } else if (idNum === 3) {
        qText = `(${v} + y + ${P(n1)})${S2} = ?`;
        correct = `${v}${S2} + y${S2} + ${P(n1*n1)} + ۲${v}y + ${P(2*n1)}${v} + ${P(2*n1)}y`;
        w1 = `${v}${S2} + y${S2} + ${P(n1)} + ۲${v}y + ${P(n1)}${v} + ${P(n1)}y`;
        w2 = `${v}${S2} + y${S2} + ${P(n1*n1)} + ${v}y + ${P(2*n1)}${v} + ${P(2*n1)}y`;
        w3 = `${v}${S2} + y${S2} + ${P(n1*n1)}`;
      } else if (idNum === 4) {
        qText = `(${v} + ${P(n1)})(${v} - ${P(n1)}) = ?`;
        correct = `${v}${S2} - ${P(n1*n1)}`;
        w1 = `${v}${S2} + ${P(n1*n1)}`;
        w2 = `${v}${S2} - ${P(2*n1)}`;
        w3 = `${v}${S2} - ${P(n1)}`;
      } else if (idNum === 5) {
        qText = `(${v} + ${P(n1)})(${v} + ${P(n2)}) = ?`;
        correct = `${v}${S2} + ${P(n1+n2)}${v} + ${P(n1*n2)}`;
        w1 = `${v}${S2} + ${P(n1*n2)}${v} + ${P(n1+n2)}`;
        w2 = `${v}${S2} + ${P(n1+n2)}${v} + ${P(n1+n2)}`;
        w3 = `${v}${S2} + ${P(n1*n2)}`;
      } else if (idNum === 6) {
        qText = `(${v} + ${P(n1)})${S3} = ?`;
        correct = `${v}${S3} + ${P(3*n1)}${v}${S2} + ${P(3*n1*n1)}${v} + ${P(n1*n1*n1)}`;
        w1 = `${v}${S3} + ${P(n1)}${v}${S2} + ${P(n1*n1)}${v} + ${P(n1*n1*n1)}`;
        w2 = `${v}${S3} + ${P(3*n1)}${v}${S2} + ${P(3*n1)}${v} + ${P(n1*3)}`;
        w3 = `${v}${S3} + ${P(n1*n1*n1)}`;
      } else if (idNum === 7) {
        qText = `(${v} - ${P(n1)})${S3} = ?`;
        correct = `${v}${S3} - ${P(3*n1)}${v}${S2} + ${P(3*n1*n1)}${v} - ${P(n1*n1*n1)}`;
        w1 = `${v}${S3} - ${P(3*n1)}${v}${S2} - ${P(3*n1*n1)}${v} - ${P(n1*n1*n1)}`;
        w2 = `${v}${S3} + ${P(3*n1)}${v}${S2} - ${P(3*n1*n1)}${v} + ${P(n1*n1*n1)}`;
        w3 = `${v}${S3} - ${P(n1*n1*n1)}`;
      } else if (idNum === 8) {
        qText = `(${v} + ${P(n1)})(${v}${S2} - ${P(n1)}${v} + ${P(n1*n1)}) = ?`;
        correct = `${v}${S3} + ${P(n1*n1*n1)}`;
        w1 = `${v}${S3} - ${P(n1*n1*n1)}`;
        w2 = `${v}${S3} + ${P(n1*n1)}`;
        w3 = `${v}${S2} + ${P(n1*n1*n1)}`;
      } else {
        qText = `(${v} - ${P(n1)})(${v}${S2} + ${P(n1)}${v} + ${P(n1*n1)}) = ?`;
        correct = `${v}${S3} - ${P(n1*n1*n1)}`;
        w1 = `${v}${S3} + ${P(n1*n1*n1)}`;
        w2 = `${v}${S3} - ${P(n1*n1)}`;
        w3 = `${v}${S2} - ${P(n1*n1*n1)}`;
      }

      return { qText, texts: [correct, w1, w2, w3] };
    }

    function generateQuizQuestions(idNum) {
      quizQuestionsData = [];
      const usedQuestions = new Set();

      for (let i = 0; i < 3; i++) {
        let q;
        let tries = 0;
        // Retry so that no wrong option equals the correct one (or another option)
        // and the same question is not repeated.
        do {
          q = buildQuestion(idNum);
          tries++;
        } while (
          (new Set(q.texts).size < 4 || usedQuestions.has(q.qText)) && tries < 60
        );
        usedQuestions.add(q.qText);

        const options = q.texts
          .map((text, idx) => ({ text, correct: idx === 0 }))
          .sort(() => Math.random() - 0.5);

        quizQuestionsData.push({ qText: q.qText, options });
      }
    }

    function renderQuizQuestion() {
      const qData = quizQuestionsData[quizQuestionStep];
      document.getElementById('quizHeader').innerText = `آزمون اتحاد شماره ${toPersianDigits(currentQuizIdentity)} (سوال ${toPersianDigits(quizQuestionStep + 1)} از ۳)`;
      document.getElementById('quizQuestion').innerHTML = qData.qText;

      const optsContainer = document.getElementById('quizOptions');
      optsContainer.innerHTML = '';

      qData.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option-btn';
        btn.innerHTML = opt.text;
        btn.onclick = () => handleAnswer(opt.correct);
        optsContainer.appendChild(btn);
      });
    }

    function handleAnswer(isCorrect) {
      if (isCorrect) quizScore++;

      quizQuestionStep++;
      if (quizQuestionStep < 3) {
        renderQuizQuestion();
      } else {
        renderQuizResult();
      }
    }

    function renderQuizResult() {
      document.getElementById('quizHeader').innerText = `نتیجه آزمون اتحاد ${toPersianDigits(currentQuizIdentity)}`;
      document.getElementById('quizQuestion').innerHTML = `
        <div style="text-align: center; font-size: 1.3rem; padding: 20px; direction: rtl; font-family: inherit;">
          تعداد پاسخ‌های صحیح شما: <b>${toPersianDigits(quizScore)}</b> از <b>۳</b>
        </div>
      `;
      document.getElementById('quizOptions').innerHTML = '';

      if (quizScore >= 2) {
        triggerCelebration();
      }
    }

    function triggerCelebration() {
      const celContainer = document.getElementById('starCelebration');
      celContainer.innerHTML = '';
      const items = ['⭐', '🌙', '✨', '🌟'];
      const count = isSmallScreen ? 25 : 40;

      for (let i = 0; i < count; i++) {
        const el = document.createElement('div');
        el.className = 'star';
        el.innerText = items[Math.floor(Math.random() * items.length)];
        el.style.left = Math.random() * 100 + '%';
        el.style.animationDuration = (2 + Math.random() * 2) + 's';
        el.style.animationDelay = (Math.random() * 1) + 's';
        celContainer.appendChild(el);
      }

      clearTimeout(celebrationTimer);
      celebrationTimer = setTimeout(() => { celContainer.innerHTML = ''; }, 6000);
    }
  </script>
</body>
